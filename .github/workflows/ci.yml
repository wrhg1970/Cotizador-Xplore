name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ee_quotes_test
          POSTGRES_USER: ee_app
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ee_app -d ee_quotes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ee_app:ci_only_password@localhost:5432/ee_quotes_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source /repo --no-banner
      - run: pnpm audit --audit-level critical
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm --filter @ee/db migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ee/web exec playwright install --with-deps chromium
      # Every PR runs the screens end to end, including e2e/full-flow.spec.ts (request → won).
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # Builds the deployable images and boots them against a real database (no registry push yet).
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ee_quotes
          POSTGRES_USER: ee_app
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ee_app -d ee_quotes"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ee_app:ci_only_password@localhost:5432/ee_quotes
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target migrate -t ee-migrate .
      - run: docker build --target api -t ee-api .
      - run: docker build --target web --build-arg API_ORIGIN=http://localhost:4000 -t ee-web .
      - name: Migrate, boot and probe
        run: |
          docker run --rm --network host -e DATABASE_URL ee-migrate
          docker run -d --name api --network host -e DATABASE_URL \
            -e WEB_ORIGIN=http://localhost:3000 -e API_PUBLIC_URL=http://localhost:3000 \
            -e ALLOWED_GOOGLE_DOMAINS=example.com -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef ee-api
          docker run -d --name web --network host ee-web
          for i in $(seq 1 30); do curl -fs localhost:4000/api/v1/health && curl -fs -o /dev/null localhost:3000/login && break; sleep 2; done
          curl -fs localhost:3000/api/v1/health
          docker inspect --format '{{.Config.User}}' ee-api | grep -qx node
      - if: failure()
        run: docker logs api; docker logs web
