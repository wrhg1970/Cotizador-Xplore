# Construye un target del Dockerfile y lo sube a Artifact Registry.
# Uso: gcloud builds submit --config infra/gcp/cloudbuild.yaml \
#        --substitutions=_IMAGE=...,_TARGET=api,_API_ORIGIN=... .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=${_TARGET}
      - --build-arg=API_ORIGIN=${_API_ORIGIN}
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _API_ORIGIN: http://localhost:4000
# pnpm install + build puede pasar de los 10 min por defecto en la máquina estándar.
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
